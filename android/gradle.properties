org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
android.useAndroidX=true
android.enableJetifier=true

# Fase 8 Pilar #3 (Edit PDF - rotate, PdfBox-Android): fix bug
# "Unresolved reference PDFBoxResourceLoader" yang ternyata BUKAN
# soal dependency/versi, tapi bug Kotlin 2.0.x "Build Tools API"
# classpath-snapshot (BuildToolsApiClasspathEntrySnapshotTransform
# gagal proses artifact tertentu, jar-nya nyasar bukan masuk
# classpath compile normal). Laporan bug serupa: JetBrains/
# intellij-platform-gradle-plugin#1950, detekt/detekt#7367 — fix
# yang terbukti berhasil di kasus itu ya baris ini.
kotlin.incremental.useClasspathSnapshot=false
