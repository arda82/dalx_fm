name: Build APK

# Build otomatis tiap push ke main, atau manual lewat tab Actions
# (workflow_dispatch) kalau mau build tanpa push dulu.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Wajib buat step "Publish ke GitHub Release" di bawah — GITHUB_TOKEN
    # default cuma read-only untuk urusan Release, tanpa ini upload
    # asset ke Release bakal gagal permission (403).
    permissions:
      contents: write

    # HAS_KEYSTORE dipakai step "Setup signing" untuk cek apakah
    # secret KEYSTORE_BASE64 sudah diisi, tanpa membaca `secrets`
    # langsung di kondisi `if` (yang tidak didukung GitHub Actions).
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Ambil dependency
        run: flutter pub get

      # Versi APK ikut nomor run GitHub Actions, biar tiap build
      # punya versionCode unik tanpa perlu diketik manual tiap kali.
      # Skema: 0.0.<run_number> — sesuaikan kalau nanti pindah ke
      # skema MAJOR.MINOR.PATCH seperti TaniLog.
      - name: Set nomor versi build
        run: |
          echo "Build number: ${{ github.run_number }}"
          sed -i "s/^version: .*/version: 0.0.${{ github.run_number }}+${{ github.run_number }}/" pubspec.yaml
          cat pubspec.yaml | grep version

      - name: Analisis kode (non-blocking)
        run: flutter analyze || true

      # Signing release: begitu keystore & GitHub Secrets sudah
      # disiapkan (lihat catatan di bawah), langkah ini otomatis
      # menulis key.properties yang dibaca build.gradle.
      #
      # Catatan teknis: kondisi `if` pada step GitHub Actions tidak
      # boleh membaca `secrets` secara langsung (itu penyebab error
      # "Unrecognized named-value: 'secrets'") — jadi secret dioper
      # dulu lewat `env` di level job, baru dicek pakai `env.` di sini.
      - name: Setup signing (kalau secrets tersedia)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/dalx-release.jks
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=dalx-release.jks
          EOF

      # --split-per-abi: hasilkan APK TERPISAH per arsitektur CPU
      # (armeabi-v7a/arm64-v8a/x86_64), bukan satu APK "gemuk" yang
      # bawa native lib buat ketiganya sekaligus. Ini flag CLI resmi
      # Flutter — SENGAJA bukan lewat splits{} manual di build.gradle,
      # karena itu konflik sama abiFilters otomatis Flutter Gradle
      # Plugin versi baru (lihat catatan di build.gradle).
      # --obfuscate + --split-debug-info: motong nama simbol Dart asli
      # (nama kelas/fungsi) keluar dari APK dan ganti jadi nama acak,
      # plus nyimpen peta simbol aslinya TERPISAH di build/symbols
      # (bukan ikut ke-bundle di APK). Efeknya APK lebih kecil, TAPI
      # stack trace crash jadi kode acak yang gak kebaca manusia kalau
      # symbol map ini gak disimpan — makanya diupload sebagai artifact
      # terpisah di step bawah, WAJIB disimpen tiap kali ada build yang
      # dipakai serius (bukan cuma buat testing internal), biar kalau
      # ada crash report nanti bisa di-"flutter symbolize" balik jadi
      # stack trace yang jelas.
      - name: Build APK (release, split per ABI, obfuscated)
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols

      # Hasil --split-per-abi ada 3 file: app-armeabi-v7a-release.apk,
      # app-arm64-v8a-release.apk, app-x86_64-release.apk. Upload
      # ketiganya jadi satu artifact (di-zip otomatis sama GitHub) —
      # download, extract, lalu pilih yang cocok sama HP kamu. HP
      # Android keluaran beberapa tahun terakhir (termasuk Xiaomi/
      # HyperOS) hampir pasti arm64-v8a — kalau ragu, cek di
      # Settings > About Phone > kernel/CPU info, atau pasang app
      # semacam "CPU-Z" buat lihat arsitektur pastinya.
      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: dalx-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 3

      # Symbol map dari --split-debug-info, DIPISAH dari artifact APK
      # di atas (retention lebih lama, karena ini yang dibutuhkan kalau
      # suatu saat perlu bedah crash report dari build tertentu — APK
      # boleh ilang setelah 3 hari, tapi symbol map lebih baik ditahan
      # lebih lama supaya crash lama masih bisa dilacak).
      - name: Upload symbol map (untuk symbolicate crash nanti)
        uses: actions/upload-artifact@v4
        with:
          name: dalx-symbols-${{ github.run_number }}
          path: build/symbols
          retention-days: 30

      # Publish APK ke GitHub Release. tag_name unik per run (build-N)
      # — GitHub blokir permanen pemakaian ULANG nama tag yang pernah
      # kepakai Immutable Release, jadi tag statis kayak "latest"
      # gagal terus mulai run kedua. make_latest: true di bawah yang
      # bikin URL github.com/<owner>/<repo>/releases/latest tetap
      # selalu ngarah ke Release TERBARU walau nama tag beda tiap run.
      #
      # PENTING (fix run #100): --split-per-abi hasilnya 3 APK yang
      # diupload PARALEL. Ternyata begitu asset PERTAMA kelar upload,
      # GitHub langsung nganggep Release-nya "published" -> asset
      # ke-2/ke-3 yang masih nyusul kena blokir Immutable Release di
      # tengah jalan (race condition), walau tag-nya udah unik. Fix
      # resmi dari pesan error GitHub: publish sebagai DRAFT dulu
      # (draft release bebas upload berkali-kali, gak kena immutable),
      # baru "terbitkan" dari draft di step TERPISAH setelah semua
      # asset dipastikan kepasang.
      - name: Publish ke GitHub Release sebagai draft (upload semua asset)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build terbaru (run #${{ github.run_number }})"
          body: |
            Build otomatis dari commit ${{ github.sha }} — run #${{ github.run_number }}.
            Bukan rilis resmi bertahap (masih skema versi 0.0.<run_number>) — ini APK hasil build terakhir dari branch `main`.
          # prerelease SENGAJA gak diset (dulu true) — GitHub nolak
          # kombinasi "prerelease + latest" (HTTP 422: "Latest release
          # cannot be draft or prerelease"). Status "bukan rilis
          # resmi bertahap" tetap kekomunikasi lewat body di atas.
          draft: true
          files: build/app/outputs/flutter-apk/app-*-release.apk

      # Terbitkan dari draft SETELAH semua asset di atas beres
      # keupload — di titik ini gak ada lagi race condition, aman.
      # --latest eksplisit nandain sebagai "Latest release" (biar
      # .../releases/latest tetap ngarah kesini), soalnya flag
      # make_latest di step draft di atas gak otomatis berlaku pas
      # nanti di-draft:false-in secara terpisah kayak gini.
      - name: Terbitkan Release dari draft
        run: gh release edit build-${{ github.run_number }} --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
