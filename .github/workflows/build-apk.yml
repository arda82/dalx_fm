name: Build APK

# Build otomatis tiap push ke main, atau manual lewat tab Actions
# (workflow_dispatch) kalau mau build tanpa push dulu.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Wajib buat step "Publish ke GitHub Release" di bawah — GITHUB_TOKEN
    # default cuma read-only untuk urusan Release, tanpa ini upload
    # asset ke Release bakal gagal permission (403).
    permissions:
      contents: write

    # HAS_KEYSTORE dipakai step "Setup signing" untuk cek apakah
    # secret KEYSTORE_BASE64 sudah diisi, tanpa membaca `secrets`
    # langsung di kondisi `if` (yang tidak didukung GitHub Actions).
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Ambil dependency
        run: flutter pub get

      # Versi APK ikut nomor run GitHub Actions, biar tiap build
      # punya versionCode unik tanpa perlu diketik manual tiap kali.
      # Skema: 0.0.<run_number> — sesuaikan kalau nanti pindah ke
      # skema MAJOR.MINOR.PATCH seperti TaniLog.
      - name: Set nomor versi build
        run: |
          echo "Build number: ${{ github.run_number }}"
          sed -i "s/^version: .*/version: 0.0.${{ github.run_number }}+${{ github.run_number }}/" pubspec.yaml
          cat pubspec.yaml | grep version

      - name: Analisis kode (non-blocking)
        run: flutter analyze || true

      # Signing release: begitu keystore & GitHub Secrets sudah
      # disiapkan (lihat catatan di bawah), langkah ini otomatis
      # menulis key.properties yang dibaca build.gradle.
      #
      # Catatan teknis: kondisi `if` pada step GitHub Actions tidak
      # boleh membaca `secrets` secara langsung (itu penyebab error
      # "Unrecognized named-value: 'secrets'") — jadi secret dioper
      # dulu lewat `env` di level job, baru dicek pakai `env.` di sini.
      - name: Setup signing (kalau secrets tersedia)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/dalx-release.jks
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=dalx-release.jks
          EOF

      # --split-per-abi: hasilkan APK TERPISAH per arsitektur CPU
      # (armeabi-v7a/arm64-v8a/x86_64), bukan satu APK "gemuk" yang
      # bawa native lib buat ketiganya sekaligus. Ini flag CLI resmi
      # Flutter — SENGAJA bukan lewat splits{} manual di build.gradle,
      # karena itu konflik sama abiFilters otomatis Flutter Gradle
      # Plugin versi baru (lihat catatan di build.gradle).
      - name: Build APK (release, split per ABI)
        run: flutter build apk --release --split-per-abi

      # Hasil --split-per-abi ada 3 file: app-armeabi-v7a-release.apk,
      # app-arm64-v8a-release.apk, app-x86_64-release.apk. Upload
      # ketiganya jadi satu artifact (di-zip otomatis sama GitHub) —
      # download, extract, lalu pilih yang cocok sama HP kamu. HP
      # Android keluaran beberapa tahun terakhir (termasuk Xiaomi/
      # HyperOS) hampir pasti arm64-v8a — kalau ragu, cek di
      # Settings > About Phone > kernel/CPU info, atau pasang app
      # semacam "CPU-Z" buat lihat arsitektur pastinya.
      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: dalx-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 3

      # Publish APK ke GitHub Release. tag_name SENGAJA unik per run
      # (bukan "latest" tetap) — GitHub blokir permanen pemakaian
      # ULANG nama tag yang pernah kepakai Immutable Release, jadi
      # nama tag statis bikin publish gagal terus di run kedua dan
      # seterusnya. Yang bikin ini tetap kelihatan kayak "rolling
      # latest" ke user adalah `make_latest: true` di bawah — itu yang
      # nandain Release ini sebagai "Latest release" di halaman
      # GitHub, dan yang bikin URL pendek
      # github.com/<owner>/<repo>/releases/latest SELALU ngarah ke
      # Release TERBARU, walau nama tag tiap run beda-beda.
      #
      # Konsekuensi: Release lama tetap numpuk di riwayat (gak ke-
      # hapus otomatis) — beda dari desain awal yang mau "ditimpa
      # terus". Kalau lama-lama kerasa penuh, bisa ditambah step
      # cleanup nanti (hapus Release yang lebih tua dari N terakhir).
      #
      # Begitu nanti pindah ke skema versi MAJOR.MINOR.PATCH (bukan
      # 0.0.<run_number> lagi), ganti `tag_name`/`name` di bawah jadi
      # ikut tag git manual (mis. ${{ github.ref_name }}), dan ganti
      # trigger `on:` di atas jadi `push: tags: ['v*']` biar tiap
      # versi punya Release sendiri-sendiri yang memang dimaksudkan
      # permanen (bukan dianggap "build sementara" lagi).
      - name: Publish ke GitHub Release (tandai sebagai Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build terbaru (run #${{ github.run_number }})"
          body: |
            Build otomatis dari commit ${{ github.sha }} — run #${{ github.run_number }}.
            Bukan rilis resmi bertahap (masih skema versi 0.0.<run_number>) — ini APK hasil build terakhir dari branch `main`.
          prerelease: true
          make_latest: true
          files: build/app/outputs/flutter-apk/app-*-release.apk
